name: Deploy ELO GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "elo-online/**"
      - ".github/workflows/deploy-elo-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "elo-online/**"
      - ".github/workflows/deploy-elo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: elo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ELO files
        shell: bash
        run: |
          test -f elo-online/index.html
          test -f elo-online/manifest.webmanifest
          test -f elo-online/sw.js
          test -f elo-online/icon.svg
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('elo-online/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('Nenhum JavaScript inline encontrado')
          Path('/tmp/elo-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/elo-inline.js
          node --check elo-online/sw.js
          python -m json.tool elo-online/manifest.webmanifest >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload ELO
        uses: actions/upload-pages-artifact@v4
        with:
          path: elo-online

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
