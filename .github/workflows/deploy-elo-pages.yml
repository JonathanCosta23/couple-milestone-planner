name: Deploy ELO GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "elo-online/**"
      - ".github/workflows/deploy-elo-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "elo-online/**"
      - ".github/workflows/deploy-elo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: elo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload ELO
        uses: actions/upload-pages-artifact@v4
        with:
          path: elo-online

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
