name: Regenerate Supabase types

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/regenerate-supabase-types.yml
      - supabase/migrations/**

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Rebuild local schema and generate types
        run: |
          set -euo pipefail
          supabase start
          supabase db reset --local
          supabase gen types typescript --local > src/integrations/supabase/types.ts
          supabase stop --no-backup
      - name: Commit generated types
        run: |
          set -euo pipefail
          if git diff --quiet -- src/integrations/supabase/types.ts; then
            echo "Supabase types already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/integrations/supabase/types.ts
          git commit -m "chore: regenerate Supabase types after ELO removal"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
