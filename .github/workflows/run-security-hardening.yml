name: Run security hardening bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-security-hardening.yml
      - .github/workflows/run-security-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f supabase/migrations/20260802030000_elo_security_hardening.sql ]]; then
            echo "Hardening already applied."
            exit 0
          fi
          awk '
            /<<'"'"'PATCH_B64'"'"'/ { capture=1; next }
            capture && /^PATCH_B64$/ { exit }
            capture { print }
          ' .github/workflows/apply-security-hardening.yml > /tmp/security.patch.gz.b64
          test -s /tmp/security.patch.gz.b64
          base64 -d /tmp/security.patch.gz.b64 | gzip -d > /tmp/security.patch
          git apply --check --exclude=.github/workflows/ownership-ci.yml /tmp/security.patch
          git apply --exclude=.github/workflows/ownership-ci.yml /tmp/security.patch

      - name: Commit hardening code
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No code changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "fix: harden ELO, local cache isolation and SEO"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
