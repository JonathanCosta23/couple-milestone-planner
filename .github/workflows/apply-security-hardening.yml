name: Apply security hardening patch

on:
  push:
    branches:
      - fix/security-storage-seo-hardening
    paths:
      - .github/workflows/apply-security-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/security-storage-seo-hardening
          fetch-depth: 0

      - name: Apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/security.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/security.patch.gz.b64 | gzip -d > /tmp/security.patch
          git apply --check /tmp/security.patch
          git apply /tmp/security.patch

      - name: Commit hardening changes and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-security-hardening.yml
          git add -A
          git commit -m "fix: harden ELO, local cache isolation and SEO"
          git push origin HEAD:fix/security-storage-seo-hardening
