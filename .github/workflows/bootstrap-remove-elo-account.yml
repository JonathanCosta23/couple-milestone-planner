name: Bootstrap remove ELO and permanent account deletion

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-remove-elo-account.yml
      - scripts/apply-remove-elo-account-delete.py

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply implementation
        run: python scripts/apply-remove-elo-account-delete.py

      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "feat: remove ELO and add permanent account deletion"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
