name: Sync ownership SQL fixtures

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Add explicit ownership to legacy lifecycle fixtures
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("supabase/tests/plan_member_lifecycle.sql")
          text = path.read_text(encoding="utf-8")

          def replace_one(pattern: str, replacement: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"Fixture {label} encontrada {count} vez(es), esperado 1")

          replace_one(
              r"INSERT INTO public\.expenses\s*\(\s*plan_id,\s*user_id,\s*member_id,\s*category,\s*expense_type,\s*is_essential,\s*amount,\s*is_recurring\s*\)\s*VALUES\s*\(\s*p,\s*u,\s*parceiro,\s*'moradia',\s*'fixed',\s*true,\s*1500,\s*true\s*\);",
              """INSERT INTO public.expenses (plan_id, user_id, member_id, ownership_scope,
                               category, expense_type, is_essential, amount, is_recurring)
          VALUES (p, u, parceiro, 'individual', 'moradia', 'fixed', true, 1500, true);""",
              "L7 expense individual",
          )

          replace_one(
              r"INSERT INTO public\.assets\s*\(\s*plan_id,\s*user_id,\s*member_id,\s*asset_type,\s*invested_amount,\s*current_amount,\s*net_estimated,\s*has_fgc,\s*has_sovereign_guarantee,\s*mark_to_market,\s*is_active\s*\)\s*VALUES\s*\(\s*p,\s*u,\s*parceiro,\s*'renda_fixa',\s*100,\s*100,\s*100,\s*true,\s*false,\s*false,\s*true\s*\);",
              """INSERT INTO public.assets (plan_id, user_id, member_id, ownership_scope, asset_type,
            invested_amount, current_amount, net_estimated,
            has_fgc, has_sovereign_guarantee, mark_to_market, is_active)
          VALUES (p, u, parceiro, 'individual', 'renda_fixa', 100, 100, 100, true, false, false, true);""",
              "L9 asset individual",
          )

          replace_one(
              r"INSERT INTO public\.income\s*\(\s*plan_id,\s*user_id,\s*member_id,\s*source,\s*income_type,\s*amount\s*\)\s*VALUES\s*\(\s*p,\s*u,\s*parceiro,\s*'Salário',\s*'salary',\s*5000\s*\);",
              """INSERT INTO public.income (plan_id, user_id, member_id, ownership_scope,
                               source, income_type, amount)
          VALUES (p, u, parceiro, 'individual', 'Salário', 'salary', 5000);""",
              "L9 income individual",
          )

          replace_one(
              r"INSERT INTO public\.expenses\s*\(\s*plan_id,\s*user_id,\s*member_id,\s*category,\s*expense_type,\s*is_essential,\s*amount,\s*is_recurring\s*\)\s*VALUES\s*\(\s*p,\s*u,\s*parceiro,\s*'moradia',\s*'fixed',\s*true,\s*1500,\s*true\s*\),\s*\(\s*p,\s*u,\s*parceiro,\s*'lazer',\s*'variable',\s*false,\s*200,\s*false\s*\);",
              """INSERT INTO public.expenses (plan_id, user_id, member_id, ownership_scope,
                               category, expense_type, is_essential, amount, is_recurring)
          VALUES (p, u, parceiro, 'individual', 'moradia', 'fixed', true, 1500, true),
                 (p, u, parceiro, 'individual', 'lazer', 'variable', false, 200, false);""",
              "L9 expenses individual",
          )

          replace_one(
              r"INSERT INTO public\.debts\s*\(\s*plan_id,\s*user_id,\s*member_id,\s*debt_type,\s*total_balance,\s*monthly_payment,\s*interest_rate,\s*effective_cost\s*\)\s*VALUES\s*\(\s*p,\s*u,\s*parceiro,\s*'cartao',\s*1000,\s*100,\s*0\.1,\s*0\.12\s*\);",
              """INSERT INTO public.debts (plan_id, user_id, member_id, ownership_scope,
                              debt_type, total_balance, monthly_payment, interest_rate, effective_cost)
          VALUES (p, u, parceiro, 'individual', 'cartao', 1000, 100, 0.1, 0.12);""",
              "L9 debt individual",
          )

          replace_one(
              r"INSERT INTO public\.income\s*\(\s*plan_id,\s*user_id,\s*member_id,\s*source,\s*income_type,\s*amount\s*\)\s*VALUES\s*\(\s*p,\s*u,\s*NULL,\s*'Legado',\s*'other',\s*100\s*\);",
              """INSERT INTO public.income (plan_id, user_id, member_id, ownership_scope,
                               source, income_type, amount)
          VALUES (p, u, NULL, 'needs_review', 'Legado', 'other', 100);""",
              "L9 income needs_review",
          )

          replace_one(
              r"INSERT INTO public\.expenses\s*\(\s*plan_id,\s*user_id,\s*member_id,\s*category,\s*expense_type,\s*is_essential,\s*amount,\s*is_recurring\s*\)\s*VALUES\s*\(\s*p,\s*u,\s*titular,\s*'moradia',\s*'fixed',\s*true,\s*1000,\s*true\s*\);",
              """INSERT INTO public.expenses (plan_id, user_id, member_id, ownership_scope,
                               category, expense_type, is_essential, amount, is_recurring)
          VALUES (p, u, titular, 'individual', 'moradia', 'fixed', true, 1000, true);""",
              "L10 expense individual",
          )

          path.write_text(text, encoding="utf-8")

      - name: Commit fixture update
        shell: bash
        run: |
          if git diff --quiet -- supabase/tests/plan_member_lifecycle.sql; then
            echo "Fixtures já sincronizadas"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/plan_member_lifecycle.sql
          git commit -m "test: declara ownership nas fixtures de lifecycle"
          git push origin HEAD:${{ github.head_ref }}
