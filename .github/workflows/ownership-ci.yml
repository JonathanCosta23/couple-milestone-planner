name: App and data integrity CI

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "src/hooks/**"
      - "src/lib/**"
      - "src/integrations/supabase/**"
      - "src/components/**"
      - "src/pages/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ownership-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-data-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Verify Node.js
        run: node --version
      - name: Install dependencies reproducibly
        run: npm ci --no-audit --no-fund
      - name: Run application CI
        run: npm run ci

  deno-functions:
    name: Deno edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts
          cache: true
      - name: Verify Deno
        run: deno --version
      - name: Run edge function tests
        run: |
          deno test \
            supabase/functions/member-identity/cpf_test.ts \
            supabase/functions/member-identity/index_test.ts \
            supabase/functions/delete-account/index_test.ts

  supabase-local:
    name: Supabase migrations and SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Verify Supabase CLI
        run: supabase --version
      - name: Start local Supabase and apply migrations
        run: supabase start
      - name: Reset database from migrations
        run: supabase db reset --local
      - name: Run SQL contracts
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for test_file in \
            supabase/tests/elo_removal_account_deletion.sql \
            supabase/tests/ownership_privileges_4c1.sql \
            supabase/tests/ownership_scope_4c1.sql \
            supabase/tests/remove_partner_payload_4c1.sql \
            supabase/tests/plan_member_preview_4c1.sql \
            supabase/tests/plan_member_reintegration_4c1.sql \
            supabase/tests/plan_privileges_hardening.sql \
            supabase/tests/plan_member_lifecycle.sql
          do
            echo "Running ${test_file}"
            psql -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -p 54322 -U postgres -d postgres \
              -f "${test_file}"
          done
      - name: Confirm no test residues
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres <<'SQL'
          DO $$
          DECLARE
            v_plans bigint;
            v_members bigint;
            v_functions bigint;
            v_triggers bigint;
          BEGIN
            SELECT count(*) INTO v_plans
              FROM public.plans
             WHERE user_id::text LIKE '00000000-0000-0000-0000-0000004c%'
                OR user_id::text LIKE '00000000-0000-0000-0000-0000000c%';
            SELECT count(*) INTO v_members
              FROM public.plan_members
             WHERE user_id::text LIKE '00000000-0000-0000-0000-0000004c%'
                OR user_id::text LIKE '00000000-0000-0000-0000-0000000c%';
            SELECT count(*) INTO v_functions
              FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
             WHERE n.nspname='public' AND p.proname LIKE '__test%';
            SELECT count(*) INTO v_triggers
              FROM pg_trigger WHERE NOT tgisinternal AND tgname LIKE '__test%';
            IF v_plans<>0 OR v_members<>0 OR v_functions<>0 OR v_triggers<>0 THEN
              RAISE EXCEPTION 'test_residue plans=% members=% functions=% triggers=%',
                v_plans, v_members, v_functions, v_triggers;
            END IF;
            RAISE NOTICE 'SQL residue check: OK';
          END $$;
          SQL
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
